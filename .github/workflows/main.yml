name: Build YueHong APK

on:
  workflow_dispatch: # 允许在网页上手动点击按钮触发
  push:
    branches: [ "main", "master" ] # 推送到主分支时自动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 如果官方要求的 NDK 29 下载不到，可能会在这里报错。
    # 也可以直接注释掉这段，让 Gradle 根据项目配置自动下载 NDK。
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29 # 对应 29.0.13113456

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YueHong-Debug-APK
        path: manager/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
